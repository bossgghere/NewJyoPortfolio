<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // apply the saved theme before the page paints (light unless the visitor chose dark)
      try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light' } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
    <title>Jyoshika Reddy</title>
    <meta
      name="description"
      content="Hi, I'm Jyoshika! 👋 I turn tiny ideas into tidy, working apps with Next.js, React, Node.js and FastAPI. Come say hi!"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Jyoshika Reddy" />
    <meta name="keywords" content="Jyoshika Reddy, Full Stack Developer, Next.js, React, Node.js, FastAPI, Hyderabad" />

    <!-- Open Graph / Twitter: how the link looks when shared -->
    <meta property="og:type" content="website" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:site_name" content="Jyoshika Reddy" />
    <meta property="og:title" content="Hi, I'm Jyoshika ✨ Full-Stack Developer" />
    <meta property="og:description" content="I turn tiny ideas into tidy, working apps with Next.js, React, Node.js and FastAPI. Come say hi! 👋" />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jyoshika Reddy - Full-Stack Developer, in a pastel flower frame with hearts and sparkles" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hi, I'm Jyoshika ✨ Full-Stack Developer" />
    <meta name="twitter:description" content="I turn tiny ideas into tidy, working apps with Next.js, React, Node.js and FastAPI." />
    <meta name="twitter:image" content="__SITE_URL__/og.jpg" />

    <!-- handwritten accent font used by .cartoonText -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
